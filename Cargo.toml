[package]
name = "rupnp"
version = "1.1.4"
authors = ["lexinda <734421679@qq.com>"]
readme = "README.md"
repository = "https://github.com/lexinda/rupnp"
description = "An asynchronous library for finding UPnP control points, performing actions on them and reading their service descriptions."
categories = ["network-programming", "asynchronous"]
keywords = ["async", "upnp", "networking", "protocols"]
license = "MIT/Apache-2.0"
edition = "2024"
# The dependency tree (tokio, hyper-util) requires Rust 1.85,
# ffmpeg-sidecar requires Rust 1.88.
rust-version = "1.88"

[features]
default = ["subscribe"]

full_device_spec = [] # store and expose the full DeviceSpec properties
# event notifications & state variable changes
subscribe = ["dep:genawaiter", "dep:if-addrs", "tokio/net", "tokio/io-util"]

[dependencies]
# tokio is required because the HTTP client runs on a tokio runtime anyway and the
# request timeouts need its timer. The net feature is needed by the http connector.
tokio = { version = "1.0", features = ["time", "net"] }
futures-core = "0.3"
# alloc 必须显式声明：hyper-util 对 futures-util 的依赖是 default-features = false
# 且不启用任何 feature，而 edition 2024 的 feature resolver v2 不再把 dev 依赖的
# feature 合并进来。StreamExt::buffered 需要它。
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
genawaiter = { version = "0.99", default-features = false, features = ["futures03"], optional = true }
if-addrs = { version = "0.13", optional = true }
http = "1.5.0"
ssdp-client = "2.1.0"
roxmltree = "0.21.2"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.11", features = ["client", "client-legacy", "http1"] }
bytes = "1.0"
http-body-util = "0.1.3"
log = "0.4"
# mp4_tool 模块的错误处理
anyhow = "1.0"
# 用于 mp4-tool 的 faststart 修复。2.7 起用 ureq（纯 Rust 的 HTTP 客户端）
# 下载 ffmpeg，不依赖系统里有没有 curl。
ffmpeg-sidecar = "2.7"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "fs", "rt-multi-thread"] }
futures = "0.3"
anyhow = "1.0"


[[example]]
name = "subscribe"
required-features = ["subscribe"]

[[example]]
name = "cast"
required-features = ["subscribe"]

[[bin]]
name = "mp4-tool"
path = "src/bin/mp4-tool.rs"
