[package]
name = "mp4-tool"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "检查与修复 MP4 的 atom 布局，使其适合 HTTP Range 播放"
license = "MIT/Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0"
# lexinda 的 fork 用 ureq（纯 Rust HTTP 客户端）下载 ffmpeg，
# 不依赖系统里有没有 curl。
ffmpeg-sidecar = { git = "https://github.com/lexinda/ffmpeg-sidecar" }
